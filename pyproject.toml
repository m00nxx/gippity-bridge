[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gippity-bridge"
version = "0.2.0"
description = "A playful local bridge from ChatGPT Web to OpenAI-shaped apps and OpenCode."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42",
  "curl_cffi>=0.11",
  "httpx>=0.27",
  "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
gippity-bridge = "chatgpt_api.cli:main"
chatgpt-api = "chatgpt_api.cli:main"

[project.urls]
Homepage = "https://github.com/m00nxx/gippity-bridge"
Repository = "https://github.com/m00nxx/gippity-bridge"
Documentation = "https://github.com/m00nxx/gippity-bridge#readme"

[tool.setuptools.packages.find]
include = ["chatgpt_api*"]
